services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: scos
      POSTGRES_PASSWORD: scos
      POSTGRES_USER: scos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scos -d scos"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - scos-postgres-data:/var/lib/postgresql

  postgres-test:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: scos_test
      POSTGRES_PASSWORD: scos_test
      POSTGRES_USER: scos_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scos_test -d scos_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql

volumes:
  scos-postgres-data:
