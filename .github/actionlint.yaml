# actionlint configuration (read by actionlint.yml and local runs).
paths:
  # The shared deploy workflow reads its environment secrets directly: its
  # jobs bind `environment: ${{ inputs.environment }}`, and GitHub lets such a
  # job read that environment's secrets, which a caller cannot pass through
  # `workflow_call`. actionlint only knows the declared `workflow_call`
  # secrets, so it reports these names as undefined. Only these names are
  # ignored, only in this file.
  .github/workflows/deploy.yml:
    ignore:
      - 'property "(cloudflare_api_token|cloudflare_terraform_api_token|cloudflare_workers_api_token|environment_secrets_token|hyperdrive_origin_password|migration_database_url|otel_exporter_otlp_headers)" is not defined in object type'
