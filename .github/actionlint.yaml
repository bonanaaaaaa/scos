# actionlint configuration (read by actionlint.yml and local runs).
paths:
  # deploy.yml declares only its required repository secrets. The prod
  # environment's secrets cannot be declared (the caller has no environment);
  # the bound job reads them, so actionlint reports them as undefined. Only
  # these two names are ignored, only in this file.
  .github/workflows/deploy.yml:
    ignore:
      - 'property "(cloudflare_api_token|otel_exporter_otlp_headers)" is not defined in object type'
