name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      coverage-artifact: ${{ steps.coverage.outputs.artifact-id }}
    env:
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm exec turbo run build
      - name: Typecheck workspace
        run: pnpm exec turbo run typecheck
      - name: Lint workspace
        run: pnpm exec turbo run lint //#lint:root
      - name: Check formatting
        run: pnpm exec turbo run //#format:check:root
      - name: Test workspace
        id: tests
        run: pnpm exec turbo run test test:workers //#test:root
      - name: Upload coverage summaries
        id: coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vitest-coverage
          path: |
            coverage/coverage-summary.json
            apps/api/coverage/coverage-summary.json
            packages/core/coverage/coverage-summary.json
            packages/persistence/coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: error

  coverage:
    name: Coverage comment
    needs: workspace
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.workspace.outputs.coverage-artifact != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download coverage summaries
        uses: actions/download-artifact@v8.0.1
        with:
          name: vitest-coverage
      - name: Comment on pull request coverage
        uses: ./.github/actions/vitest-coverage
        with:
          github_token: ${{ github.token }}

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: scos_test
          POSTGRES_PASSWORD: scos_ci
          POSTGRES_USER: scos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scos_ci -d scos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_TEST_URL: postgresql://scos_ci:scos_ci@localhost:5432/scos_test
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Reject skipped or focused integration tests
        # Real-database tests must fail, never skip. Vitest modifiers that
        # skip, defer or focus tests (describe/it/test .skip, .skipIf, .runIf,
        # .todo, .only, and ctx.skip()) are not allowed in the integration
        # suites. The match is textual, so a comment or string naming one of
        # them also fails; reword it. grep exits 1 only when nothing matched;
        # any other status (a match, or a missing directory) fails the step.
        run: |
          set +e
          grep -rnE --include='*.ts' '\.(skip|skipIf|runIf|todo|only)\b' \
            apps/api/test packages/persistence/test
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "::error::Integration tests must not use .skip, .skipIf, .runIf, .todo or .only (grep exit $status)."
            exit 1
          fi
      - name: Run persistence integration, API acceptance, OpenAPI conformance and Worker (workerd) tests
        run: pnpm exec turbo run test:integration
      - name: Check the generated OpenAPI specification is not committed
        # test:integration depends on build, which writes the specification.
        # It is a build artifact; the served /openapi.json equality, document
        # validity and response conformance are checked by
        # apps/api/test/api/openapi.integration.test.ts above. dist/ is
        # ignored, so the tracking check guards against a forced `git add -f`.
        run: |
          test -s apps/api/dist/openapi.json || {
            echo "::error::apps/api/dist/openapi.json was not generated."
            exit 1
          }
          if git ls-files --error-unmatch apps/api/dist/openapi.json >/dev/null 2>&1; then
            echo "::error::apps/api/dist/openapi.json is committed; the specification must only be generated."
            exit 1
          fi
      - name: Upload OpenAPI specification
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openapi-specification
          path: apps/api/dist/openapi.json
          retention-days: 7
          if-no-files-found: error
