name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify TypeScript 7 compiler
        run: test "$(pnpm exec tsc --version)" = "Version 7.0.2"
      - name: Run workspace checks
        run: pnpm check

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: scos_test
          POSTGRES_PASSWORD: scos_ci
          POSTGRES_USER: scos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scos_ci -d scos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_TEST_URL: postgresql://scos_ci:scos_ci@localhost:5432/scos_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify TypeScript 7 compiler
        run: test "$(pnpm exec tsc --version)" = "Version 7.0.2"
      - name: Run PostgreSQL connectivity and integration smoke
        run: pnpm test:integration
