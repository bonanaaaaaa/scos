name: Deploy Prod

# Thin caller for the prod environment (#15). A merge to main is the trigger,
# and the shared workflow (deploy.yml) deploys it straight away, by the
# user's decisions:
# - No wait for CI on the merge commit: the pull request's CI vouches for the
#   change, so CI and the deploy run in parallel on main.
# - No approval and no enable flag: every merge to main deploys to prod, and
#   the first deploy with complete settings creates the PlanetScale database
#   (billing starts). The kill switch is disabling this workflow
#   (`gh workflow disable deploy-prod.yml`).
#
# Secondary: a manual run (workflow_dispatch) on main redeploys main's head,
# gated exactly like a push. Its inputs are the operator actions:
# - rotate_credentials: reset a PlanetScale role's password and replace the
#   stored credential in the Terraform state in the same run;
# - seed_demo_data: insert the demo warehouses once, after the migrations.
# docs/deployment-pipeline.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rotate_credentials:
        description: Rotate PlanetScale role credentials (pscale role reset, then replace the value stored in the Terraform state).
        type: choice
        options: [none, runtime, migration, both]
        default: none
      seed_demo_data:
        description: After the migrations, insert the demo warehouses that are missing (one-time; never resets stock).
        type: boolean
        default: false

permissions: {}

# One prod deployment at a time; a running one is never
# cancelled. A newer push replaces a pending one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  gate:
    name: Check main
    # No environment and no secret. Only main (a push, or a manual run on
    # main).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Check main has not moved on
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! $SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected commit SHA."
            exit 1
          fi
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"
          # Never deploy an older commit over a newer one: if main has moved
          # on (for example while this run waited in the deploy-prod group),
          # skip; the newer commit's own run deploys it. An API error fails
          # the gate instead of looking like a moved main.
          head=$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')
          if [[ ! $head =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the head of main."
            exit 1
          fi
          if [[ $head != "$SHA" ]]; then
            echo "::notice title=Deploy skipped::main is at $head, not $SHA. The newer commit's run deploys it."
            echo "deploy=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >>"$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    # Caps the shared workflow's jobs: checkout and the main-head checks.
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      sha: ${{ needs.gate.outputs.sha }}
      # Operator actions exist only on a manual run; a push never rotates or
      # seeds.
      rotate_credentials: ${{ github.event_name == 'workflow_dispatch' && inputs.rotate_credentials || 'none' }}
      seed_demo_data: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_demo_data }}
    # The shared workflow needs the repository secrets and the prod
    # environment's secrets; only `inherit` makes both visible to it.
    secrets: inherit
