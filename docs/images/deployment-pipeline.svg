<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SCOS prod deployment on merge to main</title>
  <desc>On a merge to main, the Deploy Prod caller's gate, which has no environment and no secrets, checks that main has not moved on; otherwise nothing runs. It does not wait for CI on the merge commit, because the pull request's CI already passed, and there is no enable flag: disabling the workflow stops deploys. With no human approval, the shared deploy workflow runs in the prod environment and ensures the PlanetScale database exists, creating the database and its roles only if they are missing and keeping new role credentials in the Terraform state, then backs up the Terraform state, applies the saved Terraform plan for Hyperdrive, runs prisma migrate deploy directly against PlanetScale with the migration role, deploys the Worker bundle built once with its SHA-256 recorded, and checks GET /health. It checks again that main has not moved on before the database step, the apply and wrangler deploy. Any failing step stops the run and nothing is destroyed.</desc>
  <style>
    .bg { fill: #ffffff; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
    .gate rect { stroke-dasharray: 5 3; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; }
    .legend, .note, .lbl { font-size: 12px; fill: #5F5E5A; }
    .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
    .check { stroke: #888780; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
    .head { stroke: #888780; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray .th { fill: #F1EFE8; } .gray .ts { fill: #D3D1C7; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal .th { fill: #E1F5EE; } .teal .ts { fill: #9FE1CB; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple .th { fill: #EEEDFE; } .purple .ts { fill: #CECBF6; }
      .legend, .note, .lbl { fill: #D3D1C7; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="850" rx="8"/>

  <!-- 1. Merge -->
  <g class="gray"><rect x="40" y="40" width="380" height="52" rx="4" stroke-width="1"/>
    <text class="th" x="230" y="62" text-anchor="middle">Merge to main</text>
    <text class="ts" x="230" y="80" text-anchor="middle">Deploy Prod (deploy-prod.yml) starts</text></g>
  <line class="arr" x1="230" y1="92" x2="230" y2="118" marker-end="url(#a)"/>

  <!-- 2. Gate -->
  <g class="gray gate"><rect x="40" y="120" width="380" height="60" rx="4" stroke-width="1"/>
    <text class="th" x="230" y="144" text-anchor="middle">Gate in Deploy Prod (no environment, no secrets)</text>
    <text class="ts" x="230" y="163" text-anchor="middle">main still at this commit? (no CI wait, no enable flag)</text></g>
  <line class="arr" x1="420" y1="150" x2="458" y2="150" marker-end="url(#a)"/>
  <text class="lbl" x="439" y="143" text-anchor="middle">no</text>
  <g class="gray"><rect x="460" y="124" width="180" height="52" rx="4" stroke-width="1"/>
    <text class="th" x="550" y="146" text-anchor="middle">Nothing runs</text>
    <text class="ts" x="550" y="164" text-anchor="middle">no prod job starts</text></g>
  <line class="arr" x1="230" y1="180" x2="230" y2="210" marker-end="url(#a)"/>
  <text class="lbl" x="240" y="199">yes</text>

  <!-- 3. Shared workflow -->
  <g class="gray"><rect x="40" y="212" width="380" height="52" rx="4" stroke-width="1"/>
    <text class="th" x="230" y="234" text-anchor="middle">Shared deploy.yml, environment: prod</text>
    <text class="ts" x="230" y="252" text-anchor="middle">no approval step; main-only checks in the workflows</text></g>
  <line class="arr" x1="230" y1="264" x2="230" y2="290" marker-end="url(#a)"/>

  <!-- 4. Ensure database -->
  <g class="purple"><rect x="40" y="292" width="380" height="52" rx="4" stroke-width="1"/>
    <text class="th" x="230" y="314" text-anchor="middle">Ensure PlanetScale database</text>
    <text class="ts" x="230" y="332" text-anchor="middle">create database and roles only if missing</text></g>
  <line class="check" x1="420" y1="318" x2="452" y2="318"/>
  <text class="note" x="458" y="314">first run: role credentials</text>
  <text class="note" x="458" y="330">go into the Terraform state</text>
  <line class="arr" x1="230" y1="344" x2="230" y2="370" marker-end="url(#a)"/>

  <!-- 5. State backup -->
  <g class="teal"><rect x="40" y="372" width="380" height="52" rx="4" stroke-width="1"/>
    <text class="th" x="230" y="394" text-anchor="middle">Terraform state backup</text>
    <text class="ts" x="230" y="412" text-anchor="middle">copy of the current state in R2, newest 10 kept</text></g>
  <line class="arr" x1="230" y1="424" x2="230" y2="450" marker-end="url(#a)"/>

  <!-- 6. Terraform -->
  <g class="teal"><rect x="40" y="452" width="380" height="52" rx="4" stroke-width="1"/>
    <text class="th" x="230" y="474" text-anchor="middle">terraform plan -out, then apply that plan</text>
    <text class="ts" x="230" y="492" text-anchor="middle">Hyperdrive with caching disabled; plan never printed</text></g>
  <line class="check" x1="420" y1="478" x2="452" y2="478"/>
  <text class="note" x="458" y="474">checks main has not</text>
  <text class="note" x="458" y="490">moved on before apply</text>
  <line class="arr" x1="230" y1="504" x2="230" y2="530" marker-end="url(#a)"/>

  <!-- 7. Migrations -->
  <g class="purple"><rect x="40" y="532" width="380" height="52" rx="4" stroke-width="1"/>
    <text class="th" x="230" y="554" text-anchor="middle">prisma migrate deploy</text>
    <text class="ts" x="230" y="572" text-anchor="middle">migration role, direct to PlanetScale, not Hyperdrive</text></g>
  <line class="arr" x1="230" y1="584" x2="230" y2="610" marker-end="url(#a)"/>

  <!-- 8. Wrangler -->
  <g class="teal"><rect x="40" y="612" width="380" height="52" rx="4" stroke-width="1"/>
    <text class="th" x="230" y="634" text-anchor="middle">wrangler deploy</text>
    <text class="ts" x="230" y="652" text-anchor="middle">bundle built once, SHA-256 recorded, Hyperdrive ID injected</text></g>
  <line class="check" x1="420" y1="638" x2="452" y2="638"/>
  <text class="note" x="458" y="634">checks main has not</text>
  <text class="note" x="458" y="650">moved on before upload</text>
  <line class="arr" x1="230" y1="664" x2="230" y2="690" marker-end="url(#a)"/>

  <!-- 9. Health -->
  <g class="gray"><rect x="40" y="692" width="380" height="52" rx="4" stroke-width="1"/>
    <text class="th" x="230" y="714" text-anchor="middle">GET /health</text>
    <text class="ts" x="230" y="732" text-anchor="middle">on the deployed URL, with retries</text></g>

  <text class="note" x="40" y="776">Any failing step stops the run. Nothing is ever destroyed; rollback is wrangler rollback.</text>

  <!-- Legend -->
  <g class="gray"><rect x="40" y="798" width="14" height="14" rx="2" stroke-width="1"/></g>
  <text class="legend" x="60" y="810">GitHub Actions</text>
  <g class="teal"><rect x="170" y="798" width="14" height="14" rx="2" stroke-width="1"/></g>
  <text class="legend" x="190" y="810">Cloudflare (R2, Hyperdrive, Workers)</text>
  <g class="purple"><rect x="410" y="798" width="14" height="14" rx="2" stroke-width="1"/></g>
  <text class="legend" x="430" y="810">PlanetScale Postgres</text>
</svg>
