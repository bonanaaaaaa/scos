<svg xmlns="http://www.w3.org/2000/svg" width="680" height="750" viewBox="0 0 680 750" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Telemetry in the SCOS hexagonal architecture</title>
  <desc>A request flows from the HTTP client through telemetry middleware, the Hono inbound adapter, use-case decorators, the core, port decorators and the persistence adapter to PostgreSQL. The telemetry boxes use runtime-neutral telemetry ports, implemented by the Node telemetry SDK wired in the composition root, which exports to a collector and stdout. The core has no telemetry imports.</desc>
  <style>
    .bg { fill: #ffffff; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; }
    .legend { font-size: 12px; fill: #5F5E5A; }
    .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
    .uses { stroke: #1D9E75; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
    .head { stroke: #888780; } .head-teal { stroke: #1D9E75; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray .th { fill: #F1EFE8; } .gray .ts { fill: #D3D1C7; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal .th { fill: #E1F5EE; } .teal .ts { fill: #9FE1CB; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple .th { fill: #EEEDFE; } .purple .ts { fill: #CECBF6; }
      .legend { fill: #D3D1C7; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head-teal" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="750" rx="8"/>

  <g class="gray"><rect x="40" y="40" width="340" height="44" rx="4" stroke-width="0.5"/><text class="th" x="210" y="58" text-anchor="middle" dominant-baseline="central">HTTP client</text><text class="ts" x="210" y="74" text-anchor="middle" dominant-baseline="central">Sends traceparent</text></g>
  <g class="teal"><rect x="40" y="114" width="340" height="56" rx="4" stroke-width="0.5"/><text class="th" x="210" y="134" text-anchor="middle" dominant-baseline="central">Telemetry middleware</text><text class="ts" x="210" y="154" text-anchor="middle" dominant-baseline="central">Server span, duration, request log</text></g>
  <g class="gray"><rect x="40" y="200" width="340" height="56" rx="4" stroke-width="0.5"/><text class="th" x="210" y="220" text-anchor="middle" dominant-baseline="central">Hono endpoint apps</text><text class="ts" x="210" y="240" text-anchor="middle" dominant-baseline="central">Inbound adapter</text></g>
  <g class="teal"><rect x="40" y="286" width="340" height="56" rx="4" stroke-width="0.5"/><text class="th" x="210" y="306" text-anchor="middle" dominant-baseline="central">Use-case decorators</text><text class="ts" x="210" y="326" text-anchor="middle" dominant-baseline="central">Use-case spans, submission counter</text></g>
  <g class="purple"><rect x="40" y="372" width="340" height="64" rx="4" stroke-width="0.5"/><text class="th" x="210" y="394" text-anchor="middle" dominant-baseline="central">Core: domain, use cases, ports</text><text class="ts" x="210" y="416" text-anchor="middle" dominant-baseline="central">No telemetry imports</text></g>
  <g class="teal"><rect x="40" y="466" width="340" height="56" rx="4" stroke-width="0.5"/><text class="th" x="210" y="486" text-anchor="middle" dominant-baseline="central">Port decorators</text><text class="ts" x="210" y="506" text-anchor="middle" dominant-baseline="central">InventoryReader, SubmissionStore spans</text></g>
  <g class="gray"><rect x="40" y="552" width="340" height="56" rx="4" stroke-width="0.5"/><text class="th" x="210" y="572" text-anchor="middle" dominant-baseline="central">Persistence adapter</text><text class="ts" x="210" y="592" text-anchor="middle" dominant-baseline="central">Prisma over pg</text></g>
  <g class="gray"><rect x="40" y="638" width="340" height="56" rx="4" stroke-width="0.5"/><text class="th" x="210" y="658" text-anchor="middle" dominant-baseline="central">PostgreSQL</text><text class="ts" x="210" y="678" text-anchor="middle" dominant-baseline="central">Outbound resource</text></g>

  <line class="arr" x1="210" y1="84" x2="210" y2="112" marker-end="url(#a)"/>
  <line class="arr" x1="210" y1="170" x2="210" y2="198" marker-end="url(#a)"/>
  <line class="arr" x1="210" y1="256" x2="210" y2="284" marker-end="url(#a)"/>
  <line class="arr" x1="210" y1="342" x2="210" y2="370" marker-end="url(#a)"/>
  <line class="arr" x1="210" y1="436" x2="210" y2="464" marker-end="url(#a)"/>
  <line class="arr" x1="210" y1="522" x2="210" y2="550" marker-end="url(#a)"/>
  <line class="arr" x1="210" y1="608" x2="210" y2="636" marker-end="url(#a)"/>

  <g class="teal"><rect x="420" y="114" width="220" height="408" rx="4" stroke-width="0.5"/><text class="th" x="530" y="140" text-anchor="middle" dominant-baseline="central">Telemetry ports</text><text class="ts" x="530" y="160" text-anchor="middle" dominant-baseline="central">Tracer, Meter, Logger</text><text class="ts" x="530" y="180" text-anchor="middle" dominant-baseline="central">Runtime-neutral</text></g>
  <line class="uses" x1="380" y1="142" x2="418" y2="142" marker-end="url(#t)"/>
  <line class="uses" x1="380" y1="314" x2="418" y2="314" marker-end="url(#t)"/>
  <line class="uses" x1="380" y1="494" x2="418" y2="494" marker-end="url(#t)"/>
  <g class="teal"><rect x="420" y="552" width="220" height="56" rx="4" stroke-width="0.5"/><text class="th" x="530" y="572" text-anchor="middle" dominant-baseline="central">Node telemetry SDK</text><text class="ts" x="530" y="592" text-anchor="middle" dominant-baseline="central">Composition root wiring</text></g>
  <line class="uses" x1="530" y1="552" x2="530" y2="524" marker-end="url(#t)"/>
  <g class="gray"><rect x="420" y="638" width="220" height="56" rx="4" stroke-width="0.5"/><text class="th" x="530" y="658" text-anchor="middle" dominant-baseline="central">Collector and stdout</text><text class="ts" x="530" y="678" text-anchor="middle" dominant-baseline="central">OTLP spans, metrics; logs</text></g>
  <line class="arr" x1="530" y1="608" x2="530" y2="636" marker-end="url(#a)"/>

  <g class="teal"><rect x="40" y="716" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="legend" x="58" y="726">Telemetry, at the edges</text>
  <g class="purple"><rect x="230" y="716" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="legend" x="248" y="726">Core</text>
  <g class="gray"><rect x="310" y="716" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="legend" x="328" y="726">Adapters and external systems</text>
</svg>
